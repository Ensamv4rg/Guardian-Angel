[package]
name = "ga-proxy"
description = "Opt-in decrypting HTTPS proxy that decodes tracker payloads from desktop apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ga-core.workspace = true
ga-decoders.workspace = true
bytes = "1.12"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pem = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde.workspace = true
thiserror.workspace = true
time = "0.3"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[target."cfg(windows)".dependencies]
ga-platform-win.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
