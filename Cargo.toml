[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/knowledge",
    "crates/scanners",
    "crates/report",
    "crates/netmon",
    "crates/blocker",
    "crates/decoders",
    "crates/platform-win",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ga-core = { path = "crates/core" }
ga-knowledge = { path = "crates/knowledge" }
ga-scanners = { path = "crates/scanners" }
ga-report = { path = "crates/report" }
ga-netmon = { path = "crates/netmon" }
ga-blocker = { path = "crates/blocker" }
ga-decoders = { path = "crates/decoders" }
ga-platform-win = { path = "crates/platform-win" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
url = "2.5"
thiserror = "2.0"
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

# Only the future `platform-win` crate may contain unsafe code (see design doc).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
