[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/knowledge",
    "crates/scanners",
    "crates/report",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ga-core = { path = "crates/core" }
ga-knowledge = { path = "crates/knowledge" }
ga-scanners = { path = "crates/scanners" }
ga-report = { path = "crates/report" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"

# Only the future `platform-win` crate may contain unsafe code (see design doc).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
