# Builds the Windows installer and publishes it as a GitHub Release.
#
# To release, set "version" in apps/desktop/src-tauri/tauri.conf.json, commit
# and push, then either:
#   - Actions tab -> Release -> "Run workflow" (with "Publish a release"
#     ticked): tags the commit v<version> and publishes the release, or
#   - push a tag yourself:  git tag v0.1.0  and  git push origin v0.1.0
# Untick "Publish a release" for a test build: the installer is only attached
# to the run as an artifact.
# A version with a dash (0.2.0-beta.1) is published as a pre-release.
#
# Updates: with the repository secret TAURI_SIGNING_PRIVATE_KEY set (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one), the installer is
# signed and latest.json is published, which installed copies check to
# update themselves. Without it the release works but is not offered as an
# update.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (tags this commit v<version from tauri.conf.json>)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Read the app version
        id: version
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne $tag) {
              throw "Tag ${{ github.ref_name }} does not match the app version $tag in tauri.conf.json"
            }
            "publish=true" >> $env:GITHUB_OUTPUT
          } elseif ("${{ inputs.publish }}" -eq "true") {
            # Fail now rather than after a 20-minute build.
            if (git ls-remote --tags origin "refs/tags/$tag") {
              throw "Release $tag already exists. Raise the version in tauri.conf.json, commit, and run again."
            }
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            "publish=false" >> $env:GITHUB_OUTPUT
          }

      # rust-toolchain.toml picks the toolchain; this installs it.
      - name: Install Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-installer.ps1

      - name: Name the installer
        id: installer
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "No installer was produced" }
          $name = "GuardianAngel-Setup-${{ steps.version.outputs.version }}.exe"
          Copy-Item $setup.FullName $name
          "path=$name" >> $env:GITHUB_OUTPUT

          # The update manifest installed copies read. The signature covers
          # the file's contents, so it stays valid under the new name.
          $sig = "$($setup.FullName).sig"
          if (Test-Path $sig) {
            $version = "${{ steps.version.outputs.version }}"
            $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/$name"
            $platform = @{ signature = (Get-Content $sig -Raw).Trim(); url = $url }
            @{
              version = $version
              notes = "See https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{ "windows-x86_64" = $platform; "windows-x86_64-nsis" = $platform }
            } | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM latest.json
            "manifest=latest.json" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::warning::No updater signature: set the TAURI_SIGNING_PRIVATE_KEY secret so installed copies can update to this release."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.path }}
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ steps.installer.outputs.manifest }}
          if-no-files-found: error

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $files = @("${{ steps.installer.outputs.path }}")
          if ("${{ steps.installer.outputs.manifest }}") { $files += "${{ steps.installer.outputs.manifest }}" }
          # Creates the tag on this commit when it does not exist yet (manual runs).
          $ghArgs = @($tag) + $files + @("--title", "Guardian Angel $tag", "--generate-notes", "--target", "${{ github.sha }}")
          if ($tag.Contains("-")) { $ghArgs += "--prerelease" }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed" }
